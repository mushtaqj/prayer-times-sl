name: Sync Hijri Calendar with ACJU

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Max transitions to apply (leave blank to apply all ACJU has).'
        required: false
        type: string
        default: ''

jobs:
  sync-hijri:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Hijri calendar with ACJU
        run: node scripts/sync-hijri-acju.js
        env:
          COUNT: ${{ github.event.inputs.count }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/hijriCalendar.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Hijri calendar with ACJU"
            git push
          fi
