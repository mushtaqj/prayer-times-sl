name: Sync Hijri Calendar with ACJU

on:
  # Automatic: check ACJU at 21:00 and 06:00 Sri Lanka time (UTC+5:30).
  # The script only contacts ACJU from day 29 of the ongoing month, so the
  # evening of the 29th is the first check, the 30th the second, and the
  # morning slots catch announcements made late at night. Runs where ACJU has
  # nothing new make no commit.
  schedule:
    - cron: '30 15 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Max transitions to apply (leave blank to apply all ACJU has).'
        required: false
        type: string
        default: ''

concurrency:
  group: hijri-calendar
  cancel-in-progress: false

jobs:
  sync-hijri:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Hijri calendar with ACJU
        run: node scripts/sync-hijri-acju.js
        env:
          COUNT: ${{ github.event.inputs.count }}
          # Scheduled runs skip the ACJU request until day 29 of the ongoing month.
          WHEN_DUE: ${{ github.event_name == 'schedule' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/hijriCalendar.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Hijri calendar with ACJU"
            git push
          fi
