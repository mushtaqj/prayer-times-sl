name: Rollback Hijri Calendar

on:
  workflow_dispatch:

jobs:
  rollback-hijri:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Rollback Hijri Calendar JSON
        run: node scripts/rollback-hijri.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/hijriCalendar.json
          git diff --staged --quiet || git commit -m "Rollback: Revert last Hijri month completion"
          git push
